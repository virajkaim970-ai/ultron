<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milk Bill Generator</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#eef3fb;
    background-image:
      radial-gradient(circle at 8% 0%, #ffffff 0%, transparent 45%),
      radial-gradient(circle at 95% 100%, #e2ecff 0%, transparent 40%);
    min-height:100vh;
    color:#0f172a;
    padding:18px 14px 80px;
  }
  .wrap{max-width:720px;margin:0 auto}

  /* ---------- header ---------- */
  .app-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logo{
    width:54px;height:54px;border-radius:17px;display:grid;place-items:center;
    background:linear-gradient(135deg,#3b82f6,#2563eb);
    box-shadow:0 10px 20px -8px rgba(37,99,235,.75);
    font-size:28px;line-height:1;
  }
  h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:800}
  .app-header p{margin:3px 0 0;font-size:13px;color:#64748b}

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;gap:4px;background:#fff;padding:5px;border-radius:14px;
    margin-bottom:16px;border:1px solid #e6edf7;
    box-shadow:0 2px 10px -4px rgba(15,23,42,.12);
  }
  .tab{
    flex:1;padding:11px 6px;border:0;background:transparent;color:#64748b;
    font-size:14px;font-weight:700;border-radius:10px;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  .tab.active{background:#2563eb;color:#fff;box-shadow:0 6px 14px -6px rgba(37,99,235,.9)}

  /* ---------- card ---------- */
  .card{
    background:#fff;border:1px solid #e6edf7;border-radius:18px;padding:18px;
    margin-bottom:14px;box-shadow:0 4px 16px -8px rgba(15,23,42,.14);
  }
  .card-title{font-size:15px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}

  label{
    display:block;font-size:11px;color:#64748b;margin-bottom:6px;
    font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  }
  input[type=date],input[type=number]{
    width:100%;padding:13px 14px;border-radius:12px;
    border:1.5px solid #e2e8f0;background:#f8fafc;color:#0f172a;
    font-size:17px;font-family:inherit;font-weight:700;transition:.15s;
  }
  input:focus{outline:none;border-color:#2563eb;background:#fff;
    box-shadow:0 0 0 4px rgba(37,99,235,.12)}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:420px){ .row{grid-template-columns:1fr} }

  /* ---------- quantity display ---------- */
  .qty-big{
    font-size:30px;font-weight:900;color:#2563eb;letter-spacing:-.03em;
    text-align:center;margin:12px 0 2px;line-height:1;
  }
  .qty-sub{text-align:center;font-size:12.5px;color:#94a3b8;font-weight:600;margin-bottom:2px}

  .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .chip{
    padding:11px 4px;border-radius:11px;border:1.5px solid #e2e8f0;
    background:#f8fafc;color:#475569;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.12s;
  }
  .chip:hover{border-color:#bfdbfe;background:#eff6ff;color:#2563eb}
  .chip:active{transform:scale(.96)}
  .chip.sel{background:#2563eb;border-color:#2563eb;color:#fff}

  .hint{font-size:12.5px;color:#64748b;margin:12px 0 0;line-height:1.5}
  .hint.warn{color:#b45309;background:#fffbeb;border:1px solid #fde68a;
    padding:9px 11px;border-radius:10px}
  .saved{font-size:12px;color:#059669;height:14px;margin-top:8px;font-weight:700}

  /* ---------- list rows ---------- */
  .listrow{display:flex;align-items:center;gap:10px;padding:11px 0;
    border-bottom:1px solid #eef2f8}
  .listrow:last-child{border-bottom:0}
  .lr-main{flex:1;min-width:0}
  .lr-date{font-size:14px;font-weight:700}
  .lr-sub{font-size:12px;color:#64748b;margin-top:2px}
  .lr-right{text-align:right;white-space:nowrap}
  .lr-amt{font-size:14px;font-weight:800}
  .lr-rate{font-size:11px;color:#94a3b8;margin-top:2px;font-weight:600}
  .icon-btn{background:transparent;border:0;color:#cbd5e1;font-size:16px;
    cursor:pointer;padding:6px 8px;border-radius:8px;font-family:inherit;
    transition:.12s}
  .icon-btn:hover{color:#ef4444;background:#fef2f2}

  /* ---------- buttons ---------- */
  .btn{
    width:100%;padding:14px;border-radius:12px;border:0;font-size:15px;
    font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;
    transition:.15s;letter-spacing:-.01em;
  }
  .btn.primary{background:#2563eb;color:#fff;
    box-shadow:0 8px 18px -8px rgba(37,99,235,.9)}
  .btn.primary:active{transform:scale(.985)}
  .btn.ghost{background:#fff;color:#0f172a;border:1.5px solid #e2e8f0;margin-top:14px}
  .btn.ghost:hover{background:#f8fafc}

  /* ---------- quick range ---------- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  @media(max-width:480px){ .quick{grid-template-columns:1fr 1fr} }
  .quick button{
    padding:10px 4px;border-radius:10px;border:1.5px solid #e2e8f0;
    background:#f8fafc;color:#64748b;font-size:12px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:.12s;
  }
  .quick button:hover{border-color:#bfdbfe;color:#2563eb;background:#eff6ff}

  /* ---------- receipt ---------- */
  .receipt{
    background:#fff;border:1px solid #e6edf7;border-radius:18px;
    padding:22px 20px 20px;box-shadow:0 10px 30px -14px rgba(15,23,42,.28);
    margin-bottom:14px;
  }
  .receipt-head{text-align:center;padding-bottom:16px;border-bottom:2px dashed #e2e8f0}
  .receipt-head .r-title{font-size:13px;font-weight:800;color:#2563eb;
    letter-spacing:.12em;text-transform:uppercase}
  .receipt-period{font-size:13.5px;color:#64748b;font-weight:700;margin-top:7px}

  .receipt-total-label{
    font-size:11px;font-weight:800;color:#64748b;letter-spacing:.14em;
    text-transform:uppercase;margin:22px 0 8px;text-align:center;
  }
  .receipt-total{
    font-size:46px;font-weight:900;color:#2563eb;text-align:center;
    letter-spacing:-.045em;line-height:1;margin-bottom:4px;
    word-break:break-all;
  }
  .receipt-total-sub{text-align:center;font-size:13px;color:#94a3b8;font-weight:600}

  .receipt-stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
    margin-top:22px;padding-top:18px;border-top:2px dashed #e2e8f0;
  }
  .rstat{text-align:center}
  .rstat-v{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .rstat-l{font-size:10.5px;color:#94a3b8;margin-top:3px;
    text-transform:uppercase;letter-spacing:.05em;font-weight:800}

  details{margin-top:18px;border-top:2px dashed #e2e8f0;padding-top:14px}
  summary{
    cursor:pointer;font-size:13px;font-weight:800;color:#2563eb;
    list-style:none;text-align:center;user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:' ▾'}
  details[open] summary::after{content:' ▴'}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 6px;text-align:right;border-bottom:1px solid #eef2f8;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:10.5px;color:#94a3b8;text-transform:uppercase;
    letter-spacing:.05em;font-weight:800}
  td{font-weight:600}
  tfoot td{font-weight:900;border-top:2px solid #e2e8f0;border-bottom:0;
    padding-top:11px;color:#0f172a}

  .rate-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
  .rchip{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:20px;
    padding:6px 11px;font-size:11.5px;color:#475569;font-weight:700}
  .rchip b{color:#0f172a}

  .empty{text-align:center;padding:26px 10px;color:#94a3b8;font-size:13.5px;font-weight:600}

  .hidden{display:none!important}

  @media print{
    body{background:#fff;padding:0}
    .app-header,.tabs,.no-print{display:none!important}
    .receipt{border:0;box-shadow:none;padding:0}
    .receipt-total{color:#000}
    .receipt-head .r-title{color:#000}
    #tab-daily,#tab-price{display:none!important}
    #tab-bill{display:block!important}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="app-header">
    <div class="logo">🥛</div>
    <div>
      <h1>Milk Bill</h1>
      <p>Daily milk log &amp; instant bill calculator</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="daily">Daily</button>
    <button class="tab" data-tab="price">Price</button>
    <button class="tab" data-tab="bill">Bill</button>
  </div>

  <!-- ================= DAILY ================= -->
  <section id="tab-daily">

    <div class="card">
      <div class="card-title">Add milk taken</div>

      <div style="margin-bottom:16px">
        <label>Date</label>
        <input type="date" id="entryDate">
      </div>

      <label>Milk taken (liters)</label>
      <input type="number" id="qty" step="0.25" min="0" inputmode="decimal" placeholder="1.5">

      <div class="qty-big" id="qtyBig">0</div>
      <div class="qty-sub" id="qtySub">tap a quick amount below</div>

      <div class="chips" id="chips">
        <button class="chip" data-qty="0.25">250 ml</button>
        <button class="chip" data-qty="0.5">500 ml</button>
        <button class="chip" data-qty="0.75">750 ml</button>
        <button class="chip" data-qty="1">1 L</button>
        <button class="chip" data-qty="1.5">1.5 L</button>
        <button class="chip" data-qty="2">2 L</button>
      </div>

      <div class="hint" id="rateHint"></div>
      <div class="saved" id="savedMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">Recent entries</div>
      <div id="recentList"></div>
    </div>

  </section>

  <!-- ================= PRICE ================= -->
  <section id="tab-price" class="hidden">

    <div class="card">
      <div class="card-title">Set price per liter</div>
      <p class="hint" style="margin-top:0">
        When your milkman changes the rate, add a new entry with the date it starts from.
        Old bills stay correct automatically.
      </p>

      <div class="row" style="margin-top:14px">
        <div>
          <label>Effective from</label>
          <input type="date" id="priceDate">
        </div>
        <div>
          <label>Price per liter (₹)</label>
          <input type="number" id="priceVal" step="0.5" min="0" inputmode="decimal" placeholder="60">
        </div>
      </div>

      <button class="btn primary" id="addPrice" style="margin-top:14px">Save price</button>
    </div>

    <div class="card">
      <div class="card-title">Price history</div>
      <div id="priceList"></div>
    </div>

  </section>

  <!-- ================= BILL ================= -->
  <section id="tab-bill" class="hidden">

    <div class="card no-print">
      <div class="card-title">Bill period</div>

      <div class="row">
        <div>
          <label>From date</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label>To date</label>
          <input type="date" id="toDate">
        </div>
      </div>

      <div class="quick">
        <button data-range="week">This week</button>
        <button data-range="lastweek">Last week</button>
        <button data-range="month">This month</button>
        <button data-range="lastmonth">Last month</button>
      </div>

      <button class="btn primary" id="calcBtn">Calculate Bill</button>
    </div>

    <div id="billResult"></div>

  </section>

</div>

<script>
/* ============================================================
   STORAGE
   ============================================================ */
const K_ENTRIES = 'milklog.entries.v1';
const K_PRICES  = 'milklog.prices.v1';

function load(k, fb){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }
  catch(e){ return fb; }
}
function save(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
}

let entries = load(K_ENTRIES, {});   // { "2026-10-11": 1.5 }  (liters, morning only)
let prices  = load(K_PRICES, []);    // [ { from:"2026-01-01", price:60 } ]

function persist(){ save(K_ENTRIES, entries); save(K_PRICES, prices); }

/* ============================================================
   HELPERS
   ============================================================ */
const pad       = n => String(n).padStart(2, '0');
const isoOf     = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO  = () => isoOf(new Date());
const parseISO  = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtLong   = s => parseISO(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
const fmtShort  = s => parseISO(s).toLocaleDateString('en-GB', { day:'2-digit', month:'short' });

const round2 = n => Math.round((+n || 0) * 100) / 100;
const round3 = n => Math.round((+n || 0) * 1000) / 1000;

const money = n =>
  '₹' + round2(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* Turns 1.5 into "1 L 500 ml", 0.5 into "500 ml", 2 into "2 L" */
function qtyText(l){
  l = round3(l);
  if (l <= 0) return '0';
  const ml = Math.round(l * 1000);
  if (ml < 1000) return ml + ' ml';
  const whole = Math.floor(l);
  const rem   = Math.round((l - whole) * 1000);
  if (rem === 0) return whole + ' L';
  return whole + ' L ' + rem + ' ml';
}

/* Returns the price whose "from" date is the latest one <= dateStr */
function priceFor(dateStr){
  let best = null;
  for (const p of prices){
    if (p.from <= dateStr && (!best || p.from > best.from)) best = p;
  }
  return best ? best.price : null;
}

function eachDate(from, to){
  const out = [];
  const d   = parseISO(from);
  const end = parseISO(to);
  while (d <= end){ out.push(isoOf(d)); d.setDate(d.getDate() + 1); }
  return out;
}

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ============================================================
   TABS
   ============================================================ */
$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['daily','price','bill'].forEach(t => {
      $('#tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
    });
  });
});

/* ============================================================
   DAILY TAB
   ============================================================ */
let saveTimer = null;
let savedTimer = null;

function flashSaved(){
  const el = $('#savedMsg');
  el.textContent = '✓ Saved';
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { el.textContent = ''; }, 1400);
}

function updateQtyDisplay(){
  const q = parseFloat($('#qty').value) || 0;
  $('#qtyBig').textContent = qtyText(q);
  $('#qtySub').textContent = q > 0
    ? (Math.round(q * 1000) + ' ml total')
    : 'tap a quick amount below';

  // highlight matching chip
  $$('.chip').forEach(c => {
    c.classList.toggle('sel', Math.abs((parseFloat(c.dataset.qty) || 0) - q) < 0.001);
  });
}

function updateRateHint(){
  const d = $('#entryDate').value;
  const el = $('#rateHint');
  if (!d){ el.textContent = ''; el.className = 'hint'; return; }

  const rate = priceFor(d);
  if (rate == null){
    el.className = 'hint warn';
    el.textContent = '⚠ No price set for this date. Open the Price tab and add one.';
  } else {
    el.className = 'hint';
    const q = parseFloat($('#qty').value) || 0;
    el.textContent = q > 0
      ? `Rate on ${fmtLong(d)}: ${money(rate)} per liter  →  ${qtyText(q)} = ${money(q * rate)}`
      : `Rate on ${fmtLong(d)}: ${money(rate)} per liter`;
  }
}

function loadEntry(){
  const d = $('#entryDate').value;
  if (!d) return;
  const q = entries[d] || '';
  $('#qty').value = q;
  updateQtyDisplay();
  updateRateHint();
}

function saveEntry(){
  const d = $('#entryDate').value;
  if (!d) return;
  const q = round3(parseFloat($('#qty').value) || 0);

  if (q <= 0) delete entries[d];
  else        entries[d] = q;

  persist();
  renderRecent();
  updateRateHint();
  flashSaved();
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveEntry, 350);
}

$('#entryDate').addEventListener('change', loadEntry);

$('#qty').addEventListener('input', () => {
  updateQtyDisplay();
  updateRateHint();
  scheduleSave();
});
$('#qty').addEventListener('change', saveEntry);

$('#chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const current = parseFloat($('#qty').value) || 0;
  const target  = parseFloat(btn.dataset.qty);

  // tapping the same chip again clears it
  $('#qty').value = (Math.abs(current - target) < 0.001) ? '' : target;

  updateQtyDisplay();
  updateRateHint();
  saveEntry();
});

function renderRecent(){
  const keys = Object.keys(entries).sort().reverse().slice(0, 25);
  const box  = $('#recentList');

  if (!keys.length){
    box.innerHTML = '<div class="empty">No entries yet.<br>Add your first day above.</div>';
    return;
  }

  box.innerHTML = keys.map(d => {
    const q    = entries[d];
    const rate = priceFor(d);
    const amt  = rate == null ? null : q * rate;

    return `<div class="listrow">
      <div class="lr-main">
        <div class="lr-date">${fmtLong(d)}</div>
        <div class="lr-sub">${qtyText(q)}</div>
      </div>
      <div class="lr-right">
        <div class="lr-amt">${amt == null ? '—' : money(amt)}</div>
        <div class="lr-rate">${rate == null ? 'no rate' : money(rate) + '/L'}</div>
      </div>
      <button class="icon-btn" data-del="${d}" title="Delete">✕</button>
    </div>`;
  }).join('');
}

$('#recentList').addEventListener('click', e => {
  const d = e.target.getAttribute('data-del');
  if (!d) return;
  if (!confirm('Delete entry for ' + fmtLong(d) + '?')) return;
  delete entries[d];
  persist();
  renderRecent();
  if ($('#entryDate').value === d) loadEntry();
});

/* ============================================================
   PRICE TAB
   ============================================================ */
$('#addPrice').addEventListener('click', () => {
  const d = $('#priceDate').value;
  const v = parseFloat($('#priceVal').value);

  if (!d || isNaN(v) || v < 0){
    alert('Please enter a valid date and price.');
    return;
  }

  const i = prices.findIndex(p => p.from === d);
  if (i >= 0) prices[i].price = v;
  else        prices.push({ from: d, price: v });

  persist();
  renderPrices();
  renderRecent();
  updateRateHint();

  $('#priceVal').value = '';
  flashSaved();
});

function renderPrices(){
  const sorted = [...prices].sort((a, b) => a.from.localeCompare(b.from));
  const box    = $('#priceList');

  if (!sorted.length){
    box.innerHTML = '<div class="empty">No prices added yet.</div>';
    return;
  }

  const current = priceFor(todayISO());

  box.innerHTML = sorted.map((p, i) => {
    const next  = sorted[i + 1];
    const until = next ? 'until ' + fmtShort(next.from) : 'onwards';
    const isCur = current != null && p.price === current && p.from <= todayISO();

    return `<div class="listrow">
      <div class="lr-main">
        <div class="lr-date">
          ${money(p.price)} / liter
          ${isCur ? '<span style="color:#059669;font-size:11px;font-weight:800"> ● current</span>' : ''}
        </div>
        <div class="lr-sub">from ${fmtLong(p.from)} ${until}</div>
      </div>
      <button class="icon-btn" data-price-del="${p.from}" title="Delete">✕</button>
    </div>`;
  }).join('');
}

$('#priceList').addEventListener('click', e => {
  const d = e.target.getAttribute('data-price-del');
  if (!d) return;
  if (!confirm('Delete the price starting ' + fmtLong(d) + '?')) return;
  prices = prices.filter(p => p.from !== d);
  persist();
  renderPrices();
  renderRecent();
  updateRateHint();
});

/* ============================================================
   BILL TAB  — the core calculation
   ============================================================ */
function calcBill(){
  const from = $('#fromDate').value;
  const to   = $('#toDate').value;
  const box  = $('#billResult');

  if (!from || !to){
    box.innerHTML = '<div class="card"><div class="empty">Pick both dates first.</div></div>';
    return;
  }
  if (from > to){
    box.innerHTML = '<div class="card"><div class="empty">"From" date must be before "To" date.</div></div>';
    return;
  }

  const days = eachDate(from, to);

  let totalLiters = 0;
  let totalAmount = 0;
  let recordedDays = 0;
  let missingRateDays = 0;
  const rows = [];
  const byRate = new Map();

  for (const d of days){
    const q = entries[d];
    if (!q || q <= 0) continue;

    const rate = priceFor(d);
    totalLiters += q;
    recordedDays++;

    let amt = 0;
    if (rate == null){
      missingRateDays++;
    } else {
      amt = q * rate;
      totalAmount += amt;

      const g = byRate.get(rate) || { liters: 0, amount: 0, days: 0 };
      g.liters += q;
      g.amount += amt;
      g.days   += 1;
      byRate.set(rate, g);
    }

    rows.push({ d, q, rate, amt });
  }

  if (!rows.length){
    box.innerHTML = `<div class="card">
      <div class="empty">
        No milk recorded between<br><b>${fmtLong(from)}</b> and <b>${fmtLong(to)}</b>.
      </div>
    </div>`;
    return;
  }

  const rateChips = [...byRate.entries()]
    .sort((a, b) => a[0] - b[0])
    .map(([rate, g]) =>
      `<span class="rchip">@ <b>${money(rate)}/L</b> · ${qtyText(g.liters)} · ${g.days} day${g.days > 1 ? 's' : ''} = <b>${money(g.amount)}</b></span>`
    ).join('');

  const tableRows = rows.map(r => `
    <tr>
      <td>${fmtShort(r.d)}</td>
      <td>${qtyText(r.q)}</td>
      <td>${r.rate == null ? '—' : money(r.rate)}</td>
      <td>${r.rate == null ? '—' : money(r.amt)}</td>
    </tr>`).join('');

  const warn = missingRateDays
    ? `<p class="hint warn" style="margin-top:16px">
         ⚠ ${missingRateDays} day(s) have no price set, so they were not counted.
         Add a price in the Price tab.
       </p>`
    : '';

  box.innerHTML = `
    <div class="receipt" id="receipt">

      <div class="receipt-head">
        <div class="r-title">Milk Bill Summary</div>
        <div class="receipt-period">${fmtLong(from)} &nbsp;→&nbsp; ${fmtLong(to)}</div>
      </div>

      <div class="receipt-total-label">Total Amount</div>
      <div class="receipt-total">${money(totalAmount)}</div>
      <div class="receipt-total-sub">${recordedDays} day${recordedDays > 1 ? 's' : ''} of milk</div>

      <div class="receipt-stats">
        <div class="rstat">
          <div class="rstat-v">${qtyText(totalLiters)}</div>
          <div class="rstat-l">Total Milk</div>
        </div>
        <div class="rstat">
          <div class="rstat-v">${recordedDays}</div>
          <div class="rstat-l">Days</div>
        </div>
        <div class="rstat">
          <div class="rstat-v">${totalLiters > 0 ? money(totalAmount / totalLiters) : '—'}</div>
          <div class="rstat-l">Avg / Liter</div>
        </div>
      </div>

      ${rateChips ? `<div class="rate-chips">${rateChips}</div>` : ''}

      ${warn}

      <details>
        <summary>View day-by-day breakdown</summary>
        <div class="tblwrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Milk</th><th>Rate</th><th>Amount</th></tr>
            </thead>
            <tbody>${tableRows}</tbody>
            <tfoot>
              <tr>
                <td>Total</td>
                <td>${qtyText(totalLiters)}</td>
                <td></td>
                <td>${money(totalAmount)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </details>

    </div>

    <button class="btn ghost no-print" onclick="window.print()">🖨 Print / Save as PDF</button>
  `;
}

$('#calcBtn').addEventListener('click', calcBill);

/* ---------- quick date ranges ---------- */
$$('.quick button').forEach(b => {
  b.addEventListener('click', () => {
    const kind = b.dataset.range;
    const now  = new Date();
    let from, to;

    if (kind === 'week'){
      const s = new Date(now);
      s.setDate(s.getDate() - ((s.getDay() + 6) % 7));   // Monday
      from = isoOf(s); to = isoOf(now);

    } else if (kind === 'lastweek'){
      const s = new Date(now);
      s.setDate(s.getDate() - ((s.getDay() + 6) % 7) - 7);
      const e = new Date(s); e.setDate(e.getDate() + 6);
      from = isoOf(s); to = isoOf(e);

    } else if (kind === 'month'){
      from = isoOf(new Date(now.getFullYear(), now.getMonth(), 1));
      to   = isoOf(now);

    } else { // lastmonth
      from = isoOf(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      to   = isoOf(new Date(now.getFullYear(), now.getMonth(), 0));
    }

    $('#fromDate').value = from;
    $('#toDate').value   = to;
    calcBill();
  });
});

   INIT
   ============================================================ */
(function init(){
  const now = new Date();

  $('#entryDate').value = todayISO();
  $('#priceDate').value = todayISO();

  $('#fromDate').value = isoOf(new Date(now.getFullYear(), now.getMonth(), 1));
  $('#toDate').value   = isoOf(now);

  loadEntry();
  renderRecent();
  renderPrices();
})();
</script>
