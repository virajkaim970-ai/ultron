<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milk Bill Tracker</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1420; --card:#171e2e; --card2:#1e273a; --line:#2a3448;
    --text:#e8edf7; --muted:#8d9ab3; --accent:#4f8cff;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px 14px 70px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

  .tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:12px;margin-bottom:16px;border:1px solid var(--line)}
  .tab{flex:1;padding:10px;border:0;background:transparent;color:var(--muted);
       font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;font-family:inherit}
  .tab.active{background:var(--accent);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card-title{font-size:15px;font-weight:700;margin-bottom:12px}
  label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;
        font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  input[type=date],input[type=number]{
    width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:16px;font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  @media(max-width:420px){ .row3{grid-template-columns:1fr} }

  .btn{width:100%;padding:13px;border-radius:10px;border:0;font-size:15px;
       font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
  .btn:active{transform:scale(.99)}

  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  @media(max-width:480px){ .quick{grid-template-columns:1fr 1fr} }
  .quick button{padding:9px 4px;border-radius:9px;border:1px solid var(--line);
    background:var(--card2);color:var(--muted);font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit}
  .quick button:active{background:var(--accent);color:#fff}

  .hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
  .hint.warn{color:var(--amber)}
  .saved{font-size:12px;color:var(--green);height:14px;margin-top:8px;font-weight:600}

  .listrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}
  .lr-main{flex:1;min-width:0}
  .lr-date{font-size:14px;font-weight:600}
  .lr-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .lr-right{text-align:right;white-space:nowrap}
  .lr-amt{font-size:14px;font-weight:700}
  .lr-rate{font-size:11px;color:var(--muted);margin-top:2px}
  .icon-btn{background:transparent;border:0;color:var(--muted);font-size:16px;
    cursor:pointer;padding:6px 8px;border-radius:8px;font-family:inherit}
  .icon-btn:hover{color:var(--red);background:rgba(239,68,68,.1)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
  .stat.hl{background:rgba(79,140,255,.13);border-color:var(--accent)}
  .stat-v{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .stat.hl .stat-v{color:var(--accent)}
  .stat-l{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;
    letter-spacing:.04em;font-weight:600}

  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0;padding-top:12px}

  .badge{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:20px;padding:6px 11px;font-size:12px;margin:0 6px 6px 0;color:var(--muted)}
  .badge b{color:var(--text)}
  .hidden{display:none!important}

  @media print{
    body{background:#fff;color:#000;padding:0}
    .tabs,.no-print,#tab-daily,#tab-price{display:none!important}
    #tab-bill{display:block!important}
    .card{background:#fff;border:1px solid #ccc;box-shadow:none;color:#000}
    .stat{background:#f4f4f4;border-color:#ddd}
    .stat-v,.stat-l,td,th,.card-title{color:#000}
    .lr-rate,.hint{color:#555}
    th,td{border-color:#ddd}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🥛 Milk Bill Tracker</h1>
  <p class="sub">Daily entries · changing rates · any date range</p>

  <div class="tabs">
    <button class="tab active" data-tab="daily">Daily</button>
    <button class="tab" data-tab="price">Price</button>
    <button class="tab" data-tab="bill">Bill</button>
  </div>

  <!-- ============ DAILY ============ -->
  <section id="tab-daily">
    <div class="card">
      <div class="card-title">Add / edit today's milk</div>
      <div style="margin-bottom:12px">
        <label>Date</label>
        <input type="date" id="entryDate">
      </div>
      <div class="row">
        <div>
          <label>Morning (liters)</label>
          <input type="number" id="morn" step="0.1" min="0" inputmode="decimal" placeholder="0">
        </div>
        <div>
          <label>Evening (liters)</label>
          <input type="number" id="eve" step="0.1" min="0" inputmode="decimal" placeholder="0">
        </div>
      </div>
      <div class="hint" id="rateHint"></div>
      <div class="saved" id="savedMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">Recent entries</div>
      <div id="recentList"></div>
    </div>
  </section>

  <!-- ============ PRICE ============ -->
  <section id="tab-price" class="hidden">
    <div class="card">
      <div class="card-title">Set price per liter</div>
      <p class="hint" style="margin-top:0">
        When your milkman changes the rate, add a new entry with the date it starts from.
        Past bills stay correct automatically.
      </p>
      <div class="row" style="margin-top:12px">
        <div>
          <label>Effective from</label>
          <input type="date" id="priceDate">
        </div>
        <div>
          <label>Price per liter</label>
          <input type="number" id="priceVal" step="0.01" min="0" inputmode="decimal" placeholder="60">
        </div>
      </div>
      <button class="btn primary" id="addPrice">Save price</button>
    </div>

    <div class="card">
      <div class="card-title">Price history</div>
      <div id="priceList"></div>
    </div>
  </section>

  <!-- ============ BILL ============ -->
  <section id="tab-bill" class="hidden">
    <div class="card no-print">
      <div class="card-title">Bill period</div>
      <div class="row">
        <div>
          <label>From date</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label>To date</label>
          <input type="date" id="toDate">
        </div>
      </div>
      <div class="quick">
        <button data-range="week">This week</button>
        <button data-range="lastweek">Last week</button>
        <button data-range="month">This month</button>
        <button data-range="lastmonth">Last month</button>
      </div>
      <button class="btn primary" id="calcBtn">Calculate bill</button>
    </div>

    <div id="billResult"></div>
  </section>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CUR = '₹';               // change to '$', 'Rs ', 'PKR ' etc.

/* =========================================================
   STORAGE
   ========================================================= */
const K_ENTRIES = 'milk.entries.v1';
const K_PRICES  = 'milk.prices.v1';

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

let entries = load(K_ENTRIES, {});   // { "2026-10-11": {m:1.5, e:1.5} }
let prices  = load(K_PRICES, []);    // [ {from:"2026-01-01", price:60} ]

function persist(){ save(K_ENTRIES, entries); save(K_PRICES, prices); }

/* =========================================================
   DATE + NUMBER HELPERS
   ========================================================= */
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtLong  = s => parseISO(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const fmtShort = s => parseISO(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const num = n => Number((+n || 0).toFixed(2));
const money = n => CUR + (Math.round((+n||0) * 100) / 100).toFixed(2);

function eachDate(from, to){
  const out = [];
  let d = parseISO(from);
  const end = parseISO(to);
  while (d <= end){ out.push(isoOf(d)); d.setDate(d.getDate() + 1); }
  return out;
}

/* =========================================================
   PRICE LOOKUP — the heart of the app
   Returns the price whose "from" date is the latest one
   that is <= the given date.
   ========================================================= */
function priceFor(dateStr){
  let best = null;
  for (const p of prices){
    if (p.from <= dateStr && (!best || p.from > best.from)) best = p;
  }
  return best ? best.price : null;
}

/* =========================================================
   DOM SHORTCUTS
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* =========================================================
   TABS
   ========================================================= */
$$('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['daily','price','bill'].forEach(t => {
      $('#tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
    });
  });
});

/* =========================================================
   DAILY ENTRY
   ========================================================= */
function flashSaved(){
  const el = $('#savedMsg');
  el.textContent = 'Saved ✓';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.textContent = '', 1500);
}

function updateRateHint(){
  const d = $('#entryDate').value;
  if (!d){ $('#rateHint').textContent = ''; return; }
  const rate = priceFor(d);
  const el = $('#rateHint');
  if (rate == null){
    el.className = 'hint warn';
    el.textContent = '⚠ No rate set for this date. Go to the Price tab and add one.';
  } else {
    el.className = 'hint';
    el.textContent = `Rate on ${fmtLong(d)}: ${money(rate)} per liter`;
  }
}

function loadEntry(){
  const d = $('#entryDate').value;
  if (!d) return;
  const e = entries[d] || {};
  $('#morn').value = e.m != null ? e.m : '';
  $('#eve').value  = e.e != null ? e.e : '';
  updateRateHint();
}

function saveEntry(){
  const d = $('#entryDate').value;
  if (!d) return;
  const m  = parseFloat($('#morn').value) || 0;
  const ev = parseFloat($('#eve').value)  || 0;

  if (m <= 0 && ev <= 0) delete entries[d];
  else entries[d] = { m, e: ev };

  persist();
  renderRecent();
  updateRateHint();
  flashSaved();
}

$('#entryDate').addEventListener('change', loadEntry);
$('#morn').addEventListener('change', saveEntry);
$('#eve').addEventListener('change', saveEntry);

function renderRecent(){
  const keys = Object.keys(entries).sort().reverse().slice(0, 25);
  const box = $('#recentList');

  if (!keys.length){
    box.innerHTML = '<p class="hint" style="margin:0">No entries yet. Add your first day above.</p>';
    return;
  }

  box.innerHTML = keys.map(d => {
    const e = entries[d];
    const m = +e.m || 0, ev = +e.e || 0;
    const liters = num(m + ev);
    const rate = priceFor(d);
    const amt = rate == null ? null : liters * rate;

    return `<div class="listrow">
      <div class="lr-main">
        <div class="lr-date">${fmtLong(d)}</div>
        <div class="lr-sub">${num(m)} L morning + ${num(ev)} L evening = <b>${liters} L</b></div>
      </div>
      <div class="lr-right">
        <div class="lr-amt">${amt == null ? '—' : money(amt)}</div>
        <div class="lr-rate">${rate == null ? 'no rate' : money(rate) + '/L'}</div>
      </div>
      <button class="icon-btn" data-del="${d}" title="Delete">✕</button>
    </div>`;
  }).join('');
}

$('#recentList').addEventListener('click', ev => {
  const d = ev.target.getAttribute('data-del');
  if (!d) return;
  if (!confirm('Delete entry for ' + fmtLong(d) + '?')) return;
  delete entries[d];
  persist();
  renderRecent();
  if ($('#entryDate').value === d) loadEntry();
});

/* =========================================================
   PRICE SETTINGS
   ========================================================= */
$('#addPrice').addEventListener('click', () => {
  const d = $('#priceDate').value;
  const v = parseFloat($('#priceVal').value);

  if (!d || isNaN(v) || v < 0){
    alert('Please enter a valid date and price.');
    return;
  }

  const i = prices.findIndex(p => p.from === d);
  if (i >= 0) prices[i].price = v;
  else prices.push({ from: d, price: v });

  persist();
  renderPrices();
  updateRateHint();
  renderRecent();
  $('#priceVal').value = '';
  flashSaved();
});

function renderPrices(){
  const sorted = [...prices].sort((a,b) => a.from.localeCompare(b.from));
  const box = $('#priceList');

  if (!sorted.length){
    box.innerHTML = '<p class="hint" style="margin:0">No prices added yet.</p>';
    return;
  }

  const currentRate = priceFor(todayISO());

  box.innerHTML = sorted.map((p, i) => {
    const next = sorted[i+1];
    const until = next ? 'until ' + fmtShort(next.from) : 'onwards';
    const isCurrent = currentRate != null && p.price === currentRate && p.from <= todayISO();
    return `<div class="listrow">
      <div class="lr-main">
        <div class="lr-date">${money(p.price)} / liter ${isCurrent ? '<span style="color:var(--green);font-size:11px">● current</span>' : ''}</div>
        <div class="lr-sub">from ${fmtLong(p.from)} ${until}</div>
      </div>
      <button class="icon-btn" data-price-del="${p.from}" title="Delete">✕</button>
    </div>`;
  }).join('');
}

$('#priceList').addEventListener('click', ev => {
  const d = ev.target.getAttribute('data-price-del');
  if (!d) return;
  if (!confirm('Delete the price starting ' + fmtLong(d) + '?')) return;
  prices = prices.filter(p => p.from !== d);
  persist();
  renderPrices();
  renderRecent();
  updateRateHint();
});

/* =========================================================
   BILL CALCULATION
   ========================================================= */
function calcBill(){
  const from = $('#fromDate').value;
  const to   = $('#toDate').value;

  if (!from || !to){ alert('Please pick both dates.'); return; }
  if (from > to){ alert('"From" date must be before "To" date.'); return; }

  const days = eachDate(from, to);

  let totM = 0, totE = 0, totL = 0, totAmt = 0;
  let recordedDays = 0, missingRate = 0;
  const rows = [];
  const byRate = new Map();

  for (const d of days){
    const e = entries[d];
    if (!e) continue;

    const m  = +e.m || 0;
    const ev = +e.e || 0;
    if (m === 0 && ev === 0) continue;

    const liters = m + ev;
    const rate = priceFor(d);

    recordedDays++;
    totM += m; totE += ev; totL += liters;

    let amt = 0;
    if (rate == null){
      missingRate++;
    } else {
      amt = liters * rate;
      totAmt += amt;
      const g = byRate.get(rate) || { liters: 0, amount: 0, days: 0 };
      g.liters += liters; g.amount += amt; g.days++;
      byRate.set(rate, g);
    }
    rows.push({ d, m, e: ev, liters, rate, amt });
  }

  const box = $('#billResult');

  if (!rows.length){
    box.innerHTML = `<div class="card"><div class="card-title">No milk recorded</div>
      <p class="hint" style="margin:0">There are no entries between ${fmtLong(from)} and ${fmtLong(to)}.</p></div>`;
    return;
  }

  const rateBreakdown = [...byRate.entries()]
    .sort((a,b) => a[0] - b[0])
    .map(([rate, g]) =>
      `<span class="badge">@ <b>${money(rate)}/L</b> → ${num(g.liters)} L · ${g.days} day${g.days>1?'s':''} = <b>${money(g.amount)}</b></span>`
    ).join('');

  const tableRows = rows.map(r => `
    <tr>
      <td>${fmtShort(r.d)}</td>
      <td>${num(r.m)}</td>
      <td>${num(r.e)}</td>
      <td>${num(r.liters)}</td>
      <td>${r.rate == null ? '—' : money(r.rate)}</td>
      <td>${r.rate == null ? '—' : money(r.amt)}</td>
    </tr>`).join('');

  const warning = missingRate
    ? `<p class="hint warn">⚠ ${missingRate} day(s) have no price set, so they were not billed. Add a price in the Price tab.</p>`
    : '';

  box.innerHTML = `
    <div class="card">
      <div class="card-title">Bill from ${fmtLong(from)} to ${fmtLong(to)}</div>

      <div class="stats">
        <div class="stat"><div class="stat-v">${num(totM)} L</div><div class="stat-l">Morning</div></div>
        <div class="stat"><div class="stat-v">${num(totE)} L</div><div class="stat-l">Evening</div></div>
        <div class="stat"><div class="stat-v">${num(totL)} L</div><div class="stat-l">Total milk</div></div>
        <div class="stat"><div class="stat-v">${recordedDays}</div><div class="stat-l">Days</div></div>
        <div class="stat hl"><div class="stat-v">${money(totAmt)}</div><div class="stat-l">Amount due</div></div>
      </div>

      <div style="margin-bottom:14px">${rateBreakdown}</div>
      ${warning}

      <div class="tblwrap">
        <table>
          <thead>
            <tr><th>Date</th><th>Morn</th><th>Eve</th><th>Liters</th><th>Rate</th><th>Amount</th></tr>
          </thead>
          <tbody>${tableRows}</tbody>
          <tfoot>
            <tr>
              <td>Total</td>
              <td>${num(totM)}</td>
              <td>${num(totE)}</td>
              <td>${num(totL)}</td>
              <td></td>
              <td>${money(totAmt)}</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <button class="btn ghost no-print" style="margin-top:16px" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>`;
}

$('#calcBtn').addEventListener('click', calcBill);

/* ---------- quick date ranges ---------- */
$$('.quick button').forEach(b => {
  b.addEventListener('click', () => {
    const kind = b.dataset.range;
    const now = new Date();
    let from, to;

    if (kind === 'week'){
      const s = new Date(now);
      s.setDate(s.getDate() - ((s.getDay() + 6) % 7));   // Monday
      from = isoOf(s); to = isoOf(now);

    } else if (kind === 'lastweek'){
      const s = new Date(now);
      s.setDate(s.getDate() - ((s.getDay() + 6) % 7) - 7);
      const e = new Date(s); e.setDate(e.getDate() + 6);
      from = isoOf(s); to = isoOf(e);

    } else if (kind === 'month'){
      from = isoOf(new Date(now.getFullYear(), now.getMonth(), 1));
      to = isoOf(now);

    } else { // lastmonth
      from = isoOf(new Date(now.getFullYear(), now.getMonth() - 1, 1));
      to   = isoOf(new Date(now.getFullYear(), now.getMonth(), 0));
    }

    $('#fromDate').value = from;
    $('#toDate').value = to;
    calcBill();
  });
});

/* =========================================================
   INIT
   ========================================================= */
(function init(){
  const now = new Date();

  $('#entryDate').value = todayISO();
  $('#priceDate').value = todayISO();

  $('#fromDate').value = isoOf(new Date(now.getFullYear(), now.getMonth(), 1));
  $('#toDate').value   = isoOf(now);

  loadEntry();
  renderRecent();
  renderPrices();
})();
</script>
</body>
</html>
